name: build-usb4 (asahi-wip-7.2 + Apple Thunderbolt)

# On-demand build of asahi-wip-7.2 — which already carries USB4/Thunderbolt AND newer DP-alt drivers
# with a proper CD321x DP-alt path that supersedes fairydust's tipd hack — with Apple USB4 enabled,
# pushed as:
#
#   ghcr.io/<owner>/omarchy-fairydust-kernel:44-usb4
#
# No fairydust DP-alt cherry-picks: 7.2 re-did that plumbing (they conflict). This build tests USB4
# AND whether 7.2's native DP-alt path drives the monitor on its own. The clean :latest/:44 (fairydust
# HEAD) that build.yml publishes is untouched. Native arm64 build. Keep the pin in sync with build.sh.
on:
  workflow_dispatch:
    inputs:
      base_rev:
        description: "asahi-wip-7.2 revision to build (blank = the pinned tip)"
        required: false
        default: ""

env:
  FEDORA: "44"
  BASE_BRANCH: "asahi-wip-7.2"
  BASE_KREV: "236788cd2602a24c703fe7bdaddaf73ef77d2027"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image ref + base rev
        id: r
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/omarchy-fairydust-kernel"
          rev="${{ github.event.inputs.base_rev }}"
          [ -n "$rev" ] || rev="${BASE_KREV}"
          { echo "image=$image"; echo "rev=$rev"; } >> "$GITHUB_OUTPUT"
          echo "building $BASE_BRANCH @ $rev + Apple USB4 (7.2 native DP-alt)"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/arm64
          build-args: |
            FEDORA=${{ env.FEDORA }}
            KBRANCH=${{ env.BASE_BRANCH }}
            KREV=${{ steps.r.outputs.rev }}
            WITH_USB4=1
          push: true
          labels: |
            dev.omarchy.kernel.base=${{ env.BASE_BRANCH }}@${{ steps.r.outputs.rev }}
            dev.omarchy.kernel.variant=usb4+fairydust-dpalt
            org.opencontainers.image.source=https://github.com/AsahiLinux/linux
          tags: |
            ${{ steps.r.outputs.image }}:${{ env.FEDORA }}-usb4

      - name: Summary
        run: |
          {
            echo "### Pushed USB4 + DP-alt test kernel"
            echo "- \`${{ steps.r.outputs.image }}:$FEDORA-usb4\`"
            echo "- base: \`${BASE_BRANCH}@${{ steps.r.outputs.rev }}\` + CONFIG_USB4_APPLE_SOC (7.2 native DP-alt, no fairydust cherries)"
          } >> "$GITHUB_STEP_SUMMARY"
