name: build-usb4 (asahi-wip-7.2 + fairydust DP-alt + Apple Thunderbolt)

# On-demand build of asahi-wip-7.2 — which already carries USB4/Thunderbolt AND newer DP-alt drivers
# than 7.1.13 fairydust — with the 12 fairydust DP-alt activation commits cherry-picked on top and
# Apple USB4 enabled, pushed as:
#
#   ghcr.io/<owner>/omarchy-fairydust-kernel:44-usb4
#
# The clean :latest/:44 (fairydust HEAD) that build.yml publishes is untouched. Native arm64 build
# (a full kernel compile). Keep the pins below in sync with build.sh.
on:
  workflow_dispatch:
    inputs:
      base_rev:
        description: "asahi-wip-7.2 revision to build (blank = the pinned tip)"
        required: false
        default: ""

env:
  FEDORA: "44"
  BASE_BRANCH: "asahi-wip-7.2"
  BASE_KREV: "236788cd2602a24c703fe7bdaddaf73ef77d2027"
  CHERRY: "296c91ac1fa51a21117524561cd77eaf0c7fe62a 9c16792154f8454ccbc6a28309d57d531ced015a 7eb5629306578387dbee2add2ee4ec00239f723d 7003fe04cb40b6e16ca44726857fac2cba99ec43 bd435201b52785b50b511ae7df87d1f9a8a2714e 6f72fa4b26b42f8a88f1d17f4f0d2d482c1e93a8 eebf132beaf1f0c73b1471fa8f9b1f03aeb5f499 a54f5fe496c3fdee2615e42c8aa4018ed9f7f807 0b0e4af50f8cd1ccbec26265dab4de388a238182 cf8f09832bde2851528598ebbc3c59528348ea23 b4a562f643bba937229e21994069c4ee291c3510 ce9f2eba72c061a50b2d790450e90af3439d8c24"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image ref + base rev
        id: r
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/omarchy-fairydust-kernel"
          rev="${{ github.event.inputs.base_rev }}"
          [ -n "$rev" ] || rev="${BASE_KREV}"
          { echo "image=$image"; echo "rev=$rev"; } >> "$GITHUB_OUTPUT"
          echo "building $BASE_BRANCH @ $rev + fairydust DP-alt cherries + Apple USB4"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/arm64
          build-args: |
            FEDORA=${{ env.FEDORA }}
            KBRANCH=${{ env.BASE_BRANCH }}
            KREV=${{ steps.r.outputs.rev }}
            CHERRY=${{ env.CHERRY }}
            WITH_USB4=1
          push: true
          labels: |
            dev.omarchy.kernel.base=${{ env.BASE_BRANCH }}@${{ steps.r.outputs.rev }}
            dev.omarchy.kernel.variant=usb4+fairydust-dpalt
            org.opencontainers.image.source=https://github.com/AsahiLinux/linux
          tags: |
            ${{ steps.r.outputs.image }}:${{ env.FEDORA }}-usb4

      - name: Summary
        run: |
          {
            echo "### Pushed USB4 + DP-alt test kernel"
            echo "- \`${{ steps.r.outputs.image }}:$FEDORA-usb4\`"
            echo "- base: \`${BASE_BRANCH}@${{ steps.r.outputs.rev }}\` + 12 fairydust DP-alt cherries + CONFIG_USB4_APPLE_SOC"
          } >> "$GITHUB_STEP_SUMMARY"
