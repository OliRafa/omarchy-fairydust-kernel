name: build-dp622 (patched test kernel)

# On-demand build of the fairydust kernel WITH the local patches under patches/ applied
# (APPLY_PATCHES=1), pushed under a distinct tag so the clean :latest/:44 that build.yml
# publishes stays untouched:
#
#   ghcr.io/<owner>/omarchy-fairydust-kernel:44-dp622
#
# This is the PR #622 DP-alt hotplug test kernel. Consumed by omarchy-atomic's publish-dp622
# workflow. Native arm64 build (a full kernel compile — expect it to run as long as build.yml).
on:
  workflow_dispatch:
    inputs:
      krev:
        description: "fairydust revision to apply the patches onto (blank = the patches' validated base)"
        required: false
        default: ""

env:
  FEDORA: "44"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image ref + KREV
        id: r
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/omarchy-fairydust-kernel"
          krev="${{ github.event.inputs.krev }}"
          # Blank -> the patches' validated base. Keep in sync with build.sh PATCHES_BASE_KREV
          # and patches/README.md.
          [ -n "$krev" ] || krev="ce9f2eba72c061a50b2d790450e90af3439d8c24"
          { echo "image=$image"; echo "krev=$krev"; } >> "$GITHUB_OUTPUT"
          echo "building $image:$FEDORA-dp622 from fairydust $krev + patches/"

      - name: Build and push (APPLY_PATCHES=1)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/arm64
          build-args: |
            FEDORA=${{ env.FEDORA }}
            APPLY_PATCHES=1
            KREV=${{ steps.r.outputs.krev }}
          push: true
          labels: |
            dev.omarchy.fairydust.revision=${{ steps.r.outputs.krev }}
            dev.omarchy.fairydust.patches=AsahiLinux/linux#622
            org.opencontainers.image.revision=${{ steps.r.outputs.krev }}
            org.opencontainers.image.source=https://github.com/AsahiLinux/linux
          tags: |
            ${{ steps.r.outputs.image }}:${{ env.FEDORA }}-dp622

      - name: Summary
        run: |
          {
            echo "### Pushed patched test kernel"
            echo "- \`${{ steps.r.outputs.image }}:$FEDORA-dp622\`"
            echo "- fairydust base: \`${{ steps.r.outputs.krev }}\` + patches/ (PR #622)"
          } >> "$GITHUB_STEP_SUMMARY"
